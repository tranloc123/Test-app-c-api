plugins {
    id 'com.android.application'
}

android {
    namespace 'com.flogb.scbddevshell'
    compileSdk 35

    defaultConfig {
        applicationId "com.flogb.scbddevshell"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
